<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUSONEMII PLAYROOM</title>
<style>
:root{color-scheme:light;--ink:#251d39;--muted:#615771;--line:#dcd3e9;--paper:#fffaff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 88% 12%,#eedfff,transparent 48%),radial-gradient(ellipse at 0 85%,#dbf3ef,transparent 48%),#f7f0fc;color:var(--ink);font-family:"Inter","Yu Gothic UI",Meiryo,sans-serif;min-height:100vh}
a{color:inherit} button{font:inherit;color:inherit} :focus-visible{outline:3px solid #694eae;outline-offset:4px}
.wrap{width:min(1220px,calc(100% - 80px));margin:auto}
header{display:flex;align-items:center;min-height:112px;padding:15px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:clamp(8px,2vw,22px);font-family:"Arial Black",Inter,sans-serif;font-style:italic;font-weight:950;letter-spacing:-.065em;font-size:clamp(22px,5.5vw,78px);line-height:1.05;color:#392858;text-shadow:2px 2px #fff,4px 4px #c6aceb}
.brand svg{flex:none;width:clamp(24px,4.6vw,58px);height:auto}
.brand span{padding-right:.12em}
.intro{display:flex;align-items:end;justify-content:space-between;gap:22px;padding:37px 0 28px}
h1,h2,h3,p{margin:0}
.assets{position:absolute;width:0;height:0;overflow:hidden}
.site-summary{margin:22px 0;color:var(--muted);font-size:15px;line-height:1.8}
.stage{position:relative;isolation:isolate;overflow:hidden;margin:0 0 18px;padding:clamp(18px,4vw,42px);border:1px solid #c4b4db;border-radius:20px;background:linear-gradient(130deg,#d2f1e9,#e8dcff 49%,#ffdcea);box-shadow:0 12px 32px #51406f18,inset 0 0 0 6px #ffffff80}
.stage-art{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.58;pointer-events:none}
.menu-heading{font-family:"Arial Black",Inter,sans-serif;font-size:clamp(23px,3.5vw,45px);line-height:1;letter-spacing:.04em;font-weight:950;font-style:italic}
.menu-grid{display:grid;grid-template-columns:repeat(var(--columns,3),minmax(0,1fr));gap:12px;margin:18px 0 0;padding:0;list-style:none}
.social-grid{--columns:2}
.mode{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:13px;min-height:98px;padding:14px;border:1px solid #a995c5;border-radius:12px;background:linear-gradient(135deg,#fff,#e4d4ff);box-shadow:inset 0 0 0 4px #ffffff80}
.menu-grid > li:nth-child(2) .mode{background:linear-gradient(135deg,#fff,#c8efe5)}
.menu-grid > li:nth-child(3) .mode{background:linear-gradient(135deg,#fff,#ffd9e9)}
.mode svg{width:48px;height:48px;color:#76569e}
.menu-grid > li:nth-child(2) .mode svg{color:#39786d}
.menu-grid > li:nth-child(3) .mode svg{color:#9e5177}
a.mode{text-decoration:none;height:100%}
a.mode:hover,a.mode:focus-visible{border-color:#694eae;box-shadow:inset 0 0 0 4px #fff}
.mode strong{display:block;font-size:clamp(16px,2.2vw,26px);line-height:1.12}
.mode small{display:block;margin-top:5px;color:var(--muted);font-size:12px}
@media(max-width:720px){.wrap{width:calc(100% - 28px)}header{min-height:76px}.site-summary{margin:16px 0}.menu-grid:not(.social-grid){grid-template-columns:1fr}.mode{min-height:72px}}
@media(max-width:380px){.social-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<path d="M318 143v36m-18-18h36m541 306v28m-14-14h28M932 140v18m-9-9h18" stroke="#fff" stroke-width="3"/>
</symbol>
</defs>
</svg>
<div class="wrap">
<header>
<h1 class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><g stroke="#55416c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="11" height="11" rx="3" fill="#fff8ff"/><path d="M16 15h14a6 6 0 0 1 6 6v5H16Z" fill="#d9c4fa"/><path d="M4 22h32v6H4Z" fill="#ecdfff"/><path d="M4 10v23m32-8v8" fill="none"/></g></svg><span>KUSONEMII PLAYROOM</span></h1>
</header>
<main id="menu">

</div>
</body>
</html>
